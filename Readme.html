<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network-Only Coordinate Finder</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #059669;
        }
        .output-box {
            margin-top: 25px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #1e293b;
            display: none;
        }
        .coordinate-line {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            color: #34d399;
            margin: 8px 0;
            font-weight: bold;
        }
        .maps-link {
            display: inline-block;
            margin-top: 15px;
            background-color: #ea4335;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .maps-link:hover {
            background-color: #c5221f;
        }
        .network-info {
            font-size: 13px;
            color: #64748b;
            margin-top: 15px;
            text-align: left;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Network Coordinate Finder</h1>
        <p>This version reads Wi-Fi routing packets secure over HTTPS. No GPS hardware or browser location prompts are used.</p>
        
        <button class="btn" onclick="getNetworkLocation()">Trace Network Location</button>
        
        <div id="statusMessage" style="margin-top: 15px; font-style: italic;"></div>

        <div id="resultBox" class="output-box">
            <div id="latText" class="coordinate-line"></div>
            <div id="lngText" class="coordinate-line"></div>
            
            <div class="network-info">
                <strong>Network Routing Details:</strong><br>
                • Public IP: <span id="ipText" style="color: #e2e8f0; font-family: monospace;"></span><br>
                • Service Provider: <span id="ispText" style="color: #e2e8f0;"></span><br>
                • Node Region: <span id="cityText" style="color: #e2e8f0;"></span>
            </div>
            
            <a id="googleMapsBtn" class="maps-link" target="_blank">📍 View House Area on Google Maps</a>
        </div>
    </div>

    <script>
        function getNetworkLocation() {
            const statusMessage = document.getElementById('statusMessage');
            const resultBox = document.getElementById('resultBox');
            
            statusMessage.innerHTML = "🔄 Querying secure database via Wi-Fi gateway...";
            resultBox.style.display = "none";

            // Using secure HTTPS endpoint to prevent mixed content blocking
            fetch('https://ipapi.co/json/')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Database network issue");
                    }
                    return response.json();
                })
                .then(data => {
                    statusMessage.innerHTML = "✅ Network node located successfully!";
                    
                    const latitude = data.latitude;
                    const longitude = data.longitude;
                    
                    document.getElementById('latText').innerText = `Latitude: ${latitude}`;
                    document.getElementById('lngText').innerText = `Longitude: ${longitude}`;
                    document.getElementById('ipText').innerText = data.ip;
                    document.getElementById('ispText').innerText = data.org;
                    document.getElementById('cityText').innerText = `${data.city}, ${data.region}, ${data.country_name}`;

                    // Set Google Maps link directly using standard format
                    const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
                    document.getElementById('googleMapsBtn').href = mapsUrl;

                    resultBox.style.display = "block";
                })
                .catch(error => {
                    statusMessage.innerHTML = "❌ Error connecting to secure database. Check your internet connection.";
                    console.error("Tracking Error:", error);
                });
        }
    </script>
</body>
</html>
